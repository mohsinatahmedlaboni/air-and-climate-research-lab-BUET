<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACRL admin panel (prototype)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;--navy:#0B1A2C;--blue:#1F5A8C;--acc:#7A1424;--bg:#F4F5F7;--line:#E2E5EA;--text:#1B2433;--muted:#5A6473}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 'Source Sans 3','Segoe UI',Arial,sans-serif}
h1,h2,h3{font-family:Poppins,'Segoe UI',sans-serif;font-weight:600;color:var(--navy);margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-art{background:var(--navy);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art h1{color:#fff;font-size:40px;line-height:1.15;max-width:420px}
.login-art p{color:#C9D4E0;max-width:420px}
.login-art .dots{position:absolute;right:-40px;bottom:-40px;width:420px;height:420px;background-image:radial-gradient(rgba(169,196,222,.35) 1.4px,transparent 1.6px);background-size:14px 14px;mask-image:radial-gradient(circle,#000 30%,transparent 70%)}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px;background:#fff}
.login-form form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.logo-chip{background:#fff;border-radius:4px;padding:8px 10px;display:inline-flex;align-self:flex-start}
.logo-chip img{height:40px;display:block}
@media(max-width:820px){.login{grid-template-columns:1fr}.login-art{min-height:220px;padding:32px}.login-art h1{font-size:28px}}
/* shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--navy);color:#C9D4E0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.side .brand span{display:block;font:600 13px Poppins,sans-serif;color:#fff;margin-top:8px;letter-spacing:.04em}
.side nav{padding:12px 10px;flex:1}
.side .grp{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#7F93A8;padding:14px 10px 6px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:4px;color:#D7E0EA;text-decoration:none;font-size:15px}
.side a:hover{background:rgba(255,255,255,.07);color:#fff}
.side a.on{background:#fff;color:var(--navy);font-weight:600}
.side a svg{flex:none;opacity:.85}
.side .cnt{margin-left:auto;background:var(--acc);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
.side .me{padding:14px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:14px}
.side .me select{width:100%;margin-top:6px;background:#13263D;color:#fff;border:1px solid #2A4058;border-radius:4px;padding:6px}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:20px;margin-right:auto}
.top .menu-t{display:none}
main{padding:28px;max-width:1240px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;width:260px;z-index:20;transform:translateX(-100%);transition:transform .2s}.side.open{transform:none}.top .menu-t{display:inline-flex}main{padding:18px}.top{padding:12px 18px}}
/* bits */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:4px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:#C3C9D2}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:#1F4E7A}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:#A11F2C}
.btn.sm{min-height:32px;padding:0 10px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px}
.pad{padding:20px 22px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:#EEF1F5;color:var(--muted);white-space:nowrap}
.chip.pub{background:#E2F2E8;color:#1D6B3A}.chip.draft{background:#EEF1F5;color:#5A6473}.chip.review{background:#FDF0D8;color:#7A4B00}
.chip.open{background:var(--acc);color:#fff}.chip.closed{background:#ECEAE4;color:#5A6473}
.chip.blue{background:#E3ECF5;color:#123E63}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.stat b{display:block;font:600 30px Poppins,sans-serif;color:var(--navy)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat a{font-size:14px;font-weight:600;margin-top:6px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.list li:last-child{border-bottom:0}
/* table */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{min-height:40px;border:1px solid var(--line);border-radius:4px;padding:0 12px;min-width:240px;background:#fff}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
table{width:100%;border-collapse:collapse;background:#fff}
th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);background:#FAFBFC}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:#F8FAFC}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:center 22%;background:#E9EEF3;display:inline-flex;align-items:center;justify-content:center;font:600 12px Poppins,sans-serif;color:var(--muted);flex:none}
.thumb{width:56px;height:40px;border-radius:3px;object-fit:cover;background:#E9EEF3;flex:none}
.handle{cursor:grab;color:#9AA4B0;padding:0 4px}
/* form */
.form{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media(max-width:1000px){.form{grid-template-columns:1fr}}
.fields{display:flex;flex-direction:column;gap:18px}
.f label,.f .lb{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.f .hint{font-size:13px;color:var(--muted);margin-top:4px}
.f input[type=text],.f input[type=email],.f input[type=url],.f input[type=date],.f input[type=time],.f input[type=password],.f select,.f textarea{width:100%;min-height:42px;border:1px solid #CDD3DB;border-radius:4px;padding:8px 12px;background:#fff}
.f textarea{min-height:110px;resize:vertical}
.f .over{color:#A11F2C;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:600px){.two{grid-template-columns:1fr}}
.rte{border:1px solid #CDD3DB;border-radius:4px;background:#fff}
.rte .tb{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:#FAFBFC}
.rte .tb button{border:0;background:none;min-width:34px;height:32px;border-radius:3px;cursor:pointer;font-weight:600;color:#3A4556}
.rte .tb button:hover{background:#E9EEF3}
.rte .tb .sep{width:1px;background:var(--line);margin:4px 4px}
.rte .ed{min-height:220px;padding:14px 16px;outline:none}
.rte .ed:focus{box-shadow:inset 0 0 0 2px #BFD3E6}
.embed{border:1px dashed #9FB3C8;border-radius:4px;padding:12px;margin:10px 0;background:#F4F8FC;font-size:14px;color:#123E63;display:flex;gap:10px;align-items:center}
.ed img{max-width:100%;border-radius:4px}
.drop{border:2px dashed #CDD3DB;border-radius:6px;padding:18px;text-align:center;color:var(--muted);background:#FAFBFC;cursor:pointer}
.drop:hover{border-color:var(--blue);color:var(--blue)}
.round{width:140px;height:140px;border-radius:50%;object-fit:cover;object-position:center 22%;border:4px solid #fff;box-shadow:0 0 0 2px #C9A1A6;display:block;margin:0 auto 10px;background:#E9EEF3}
.tags{display:flex;flex-wrap:wrap;gap:6px;border:1px solid #CDD3DB;border-radius:4px;padding:6px;background:#fff}
.tags span{background:#F6E4E7;color:#6B1322;font-size:13px;font-weight:600;border-radius:999px;padding:3px 6px 3px 10px;display:inline-flex;gap:4px;align-items:center}
.tags span button{border:0;background:none;cursor:pointer;color:#6B1322;font-size:14px;line-height:1}
.tags input{border:0;outline:0;flex:1;min-width:120px;padding:4px}
.side-card{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
.note{font-size:14px;background:#F4F8FC;border:1px solid #D6E3F0;border-radius:4px;padding:10px 12px;color:#123E63}
.note.warn{background:#FFF7E8;border-color:#F2DDB0;color:#6A4500}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:60;font-weight:600}
dialog{border:0;border-radius:8px;padding:0;max-width:520px;width:calc(100vw - 32px);background:#fff;color:var(--text)}
dialog::backdrop{background:rgba(11,26,44,.55)}
dialog .pad{display:flex;flex-direction:column;gap:14px}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.media figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer}
.media figure.sel{outline:3px solid var(--blue)}
.media img{width:100%;height:110px;object-fit:cover;display:block;background:#E9EEF3}
.media figcaption{font-size:13px;padding:6px 8px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.logos .lg{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;font-size:14px}
.logos .lg .ph{height:56px;width:100%;display:flex;align-items:center;justify-content:center;border:1px dashed #CDD3DB;border-radius:4px;color:var(--muted);font-size:12px}
.logos .lg img{max-height:56px;max-width:140px}
.logos .lg.drag{opacity:.4}
.empty{padding:36px;text-align:center;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;background:#FFF7E8;border:1px solid #F2DDB0;border-radius:6px;padding:12px 16px;margin-bottom:18px;color:#6A4500;font-size:15px}
.tags input[type=text]{border:0!important;min-height:30px!important;padding:4px!important;flex:1;min-width:140px}
.f label.btn,.row label.btn{display:inline-flex;margin:0;font-size:14px;cursor:pointer}
.f .row .btn{min-height:36px}
</style></head>

  $("#pUp").onchange = (e) => upload(e.target.files[0], (n) => { const d = $("#dlg"); d.innerHTML = `<form method="dialog" class="pad"><h2 style="font-size:20px">Partner name</h2><div class="f"><label for="pn">Name shown under the logo</label><input id="pn" type="text"></div><div class="row" style="justify-content:flex-end"><button class="btn pri" value="ok">Add partner</button></div></form>`; d.onclose = () => { S.partners.push({ name: $("#pn", d).value || n, logo: n }); partners(); }; d.showModal(); }, "Partners and logos");
}
/* ---------- pages & settings ---------- */
function pages() {
  const s = S.settings, fld = (k, l, t = "text", h = "") => fieldHTML([k, l, t, null, h], s);
  page("Pages and settings", "", `<form class="fields" id="edForm" style="max-width:860px">
  <div class="card pad fields"><h2 style="font-size:18px">Home page header</h2>${fld("kicker", "Small line above the title")}${fld("heroTitle", "Title")}${fld("tagline", "Tagline", "textarea")}</div>
  <div class="card pad fields"><h2 style="font-size:18px">About page</h2>${fld("aboutTitle", "Heading")}${fieldHTML(["about", "About text", "rich"], s)}</div>
  <div class="card pad fields"><h2 style="font-size:18px">Contact details</h2>${fld("address", "Address", "textarea", "One line per row. Shown on the Contact page, home page and footer.")}${fld("mapQuery", "Map location", "text", "What Google Maps should search for.")}</div>
  <div class="card pad fields"><h2 style="font-size:18px">Social media pages</h2><p class="muted" style="margin:-8px 0 0;font-size:14px">Shown as icons on the site. Choose the platform, then paste the page link.</p><div id="socList">${(s.social || []).map(socRow).join("")}</div><button type="button" class="btn sm" id="addSoc" style="align-self:flex-start">${I(IC.plus, 14)}Add social media page</button></div>
  <div class="card pad fields"><h2 style="font-size:18px">Form notifications</h2>${fld("notify", "Send form submissions to", "email", "Every Join the network and event registration form is emailed here and saved in the Inbox.")}
    <div class="two">${fieldHTML(["notifyJoin", "Email me for Join the network", "check"], s)}${fieldHTML(["notifyReg", "Email me for event registrations", "check"], s)}</div></div>
  <div class="card pad fields"><h2 style="font-size:18px">Footer</h2>${fld("footer", "Footer text", "textarea")}</div>
  <div class="row"><button type="button" class="btn pri" id="saveSet">Save changes</button><span class="muted" style="font-size:14px">Changes to pages and settings go live straight away.</span></div></form>`, "pages");
  wireEditor(s);
  const sl = $("#socList");
  $("#addSoc").onclick = () => sl.insertAdjacentHTML("beforeend", socRow({ platform: "LinkedIn", url: "" }));
  sl.onchange = (e) => { if (e.target.matches("select")) e.target.closest("[data-soc]").querySelector("[data-other]").classList.toggle("hidden", e.target.value !== "Other"); };
  sl.onclick = (e) => { if (e.target.closest("[data-rmsoc]")) e.target.closest("[data-soc]").remove(); };
  $("#saveSet").onclick = () => { collect(s); s.social = [...sl.querySelectorAll("[data-soc]")].map((r) => ({ platform: $("select", r).value, other: $("[data-other]", r).value, url: $("[data-url]", r).value })).filter((r) => r.url); log("updated pages and settings"); toast("Saved"); };
}
const SOCIAL = ["LinkedIn", "Facebook", "X (Twitter)", "YouTube", "Instagram", "ResearchGate", "Other"];
const socRow = (r) => `<div data-soc class="two" style="grid-template-columns:180px 1fr auto;margin-bottom:8px;align-items:start"><div style="display:flex;flex-direction:column;gap:6px"><select aria-label="Platform" style="min-height:42px;border:1px solid #CDD3DB;border-radius:4px;padding:0 8px">${SOCIAL.map((p) => `<option ${p === r.platform ? "selected" : ""}>${p}</option>`).join("")}</select><input data-other type="text" placeholder="Platform name" aria-label="Platform name" value="${esc(r.other || "")}" class="${r.platform === "Other" ? "" : "hidden"}" style="min-height:42px;border:1px solid #CDD3DB;border-radius:4px;padding:0 10px"></div><input data-url type="url" placeholder="https://" aria-label="Page link" value="${esc(r.url)}" style="min-height:42px;border:1px solid #CDD3DB;border-radius:4px;padding:0 10px"><button type="button" class="btn sm ghost danger" data-rmsoc aria-label="Remove">${I(IC.trash, 16)}</button></div>`;
/* ---------- media ---------- */
function media(fd = "People") {
  const items = S.media.filter((m) => m.folder === fd);
  page("Media library", `<label class="btn pri">${I(IC.plus, 16)}Upload to ${esc(fd)}<input type="file" accept="image/*" multiple class="hidden" id="mUp"></label>`, `<div style="display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start" class="mlib">
  <nav aria-label="Folders" class="card" style="padding:8px">${FOLDERS.map((f) => `<button class="btn ghost" data-fd="${esc(f)}" style="width:100%;justify-content:space-between;text-align:left;font-weight:${f === fd ? 600 : 500};${f === fd ? "background:#E9EEF3" : ""}" ${f === fd ? 'aria-current="true"' : ""}><span style="display:inline-flex;gap:8px;align-items:center">${I('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>', 16)}${esc(f)}</span><span class="muted" style="font-weight:400">${S.media.filter((m) => m.folder === f).length}</span></button>`).join("")}</nav>
  <div><h2 style="font-size:18px;margin-bottom:12px">${esc(fd)}</h2>${items.length ? `<div class="media">${items.map((m) => { const i = S.media.indexOf(m); return `<figure><img src="${m.src}" alt=""><figcaption title="${esc(m.name)}">${esc(m.name)}${m.size ? ` · ${m.size}` : ""}</figcaption><div style="display:flex;gap:4px;padding:0 6px 8px"><select data-mv="${i}" aria-label="Move ${esc(m.name)} to folder" style="flex:1;min-width:0;font-size:13px;border:1px solid #CDD3DB;border-radius:4px">${FOLDERS.map((f) => `<option ${f === m.folder ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>${ROLE === "admin" ? `<button class="btn sm ghost danger" data-mrm="${i}" aria-label="Delete ${esc(m.name)}">${I(IC.trash, 14)}</button>` : ""}</div></figure>`; }).join("")}</div>` : `<div class="card empty">No images in ${esc(fd)} yet.</div>`}</div></div>
  <style>@media(max-width:800px){.mlib{grid-template-columns:1fr!important}}</style>`, "media");
  document.querySelectorAll("[data-fd]").forEach((b) => b.onclick = () => media(b.dataset.fd));
  document.querySelectorAll("[data-mv]").forEach((s) => s.onchange = () => { S.media[+s.dataset.mv].folder = s.value; toast(`Moved to ${s.value}`); media(fd); });
  $("#mUp").onchange = (e) => { [...e.target.files].forEach((f) => upload(f, null, fd)); setTimeout(() => media(fd), 400); };
  document.querySelectorAll("[data-mrm]").forEach((b) => b.onclick = () => confirmBox("Delete this image?", "Pages using it will show an empty space until another image is chosen.", "Delete", () => { S.media.splice(+b.dataset.mrm, 1); media(fd); }));
}
/* ---------- review queue ---------- */
function review() {
  const items = CONTENT.flatMap((k) => SCHEMA[k].list().map((x, i) => ({ k, x, i })).filter(({ x }) => x.wf === "In review"));
  page("Review queue", "", `<p class="muted" style="margin:0 0 16px">Changes submitted by editors. Nothing here is on the website until you approve it.</p>${items.length ? `<div class="tw"><table><thead><tr><th>Item</th><th>Section</th><th>Submitted by</th><th></th></tr></thead><tbody>${items.map(({ k, x, i }) => `<tr><td><strong>${esc(x.title || x.name)}</strong></td><td>${SCHEMA[k].title}</td><td>${esc(x.by || "Editor")}</td><td style="text-align:right;white-space:nowrap"><a class="btn sm" href="#/${k}/${i}">Review</a> <button class="btn sm pri" data-ok="${k}:${i}">Approve</button></td></tr>`).join("")}</tbody></table></div>` : `<div class="card empty">All caught up. Nothing is waiting for review.</div>`}`, "review");
  document.querySelectorAll("[data-ok]").forEach((b) => b.onclick = () => { const [k, i] = b.dataset.ok.split(":"), x = SCHEMA[k].list()[+i]; x.wf = "Published"; delete x.by; log(`approved and published "${x.title || x.name}"`); toast("Approved and published"); review(); });
}
/* ---------- inbox ---------- */
function inbox(tab = "join") {
  const rows = S.inbox.filter((x) => x.form === tab);
  page("Inbox", `<button class="btn" id="csv">Export to Excel (CSV)</button>`, `<div class="note" style="margin-bottom:16px">Each submission is also emailed to <strong>${esc(S.settings.notify)}</strong>.</div>
  <div class="tabs" style="margin-bottom:14px"><button class="${tab === "join" ? "on" : ""}" data-t="join">Join the network <span class="muted">${S.inbox.filter((x) => x.form === "join").length}</span></button><button class="${tab === "reg" ? "on" : ""}" data-t="reg">Event registrations <span class="muted">${S.inbox.filter((x) => x.form === "reg").length}</span></button></div>
  ${rows.length ? `<div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Affiliation</th><th>${tab === "join" ? "Interested in" : "Event"}</th><th>Received</th></tr></thead><tbody>${rows.map((r) => `<tr><td><strong>${esc(r.name)}</strong> ${r.isNew ? '<span class="chip review">New</span>' : ""}</td><td><a href="mailto:${esc(r.email)}">${esc(r.email)}</a></td><td>${esc(r.aff)}</td><td>${esc(r.what)}</td><td class="muted">${esc(r.when)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="card empty">No submissions yet.</div>`}`, "inbox");
  rows.forEach((r) => r.isNew = false);
  document.querySelectorAll("[data-t]").forEach((b) => b.onclick = () => inbox(b.dataset.t));
  $("#csv").onclick = () => { const csv = [["Name", "Email", "Affiliation", tab === "join" ? "Interested in" : "Event", "Received"], ...rows.map((r) => [r.name, r.email, r.aff, r.what, r.when])].map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `acrl-${tab}.csv`; a.click(); toast("Exported to CSV"); };
}
/* ---------- users ---------- */
function users() {
  page("Admin users", `<button class="btn pri" id="inv">${I(IC.plus, 16)}Add user</button>`, `<p class="muted" style="margin:0 0 16px"><strong>Admins</strong> can change everything and approve editors' work. <strong>Editors</strong> can add and edit news, events, people and publications; their changes wait for an admin's approval.</p>
  <div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Last active</th><th></th></tr></thead><tbody>${S.users.map((u, i) => `<tr><td><strong>${esc(u.name)}</strong></td><td>${esc(u.email)}</td><td><select data-role="${i}" aria-label="Role for ${esc(u.name)}" style="min-height:34px;border:1px solid #CDD3DB;border-radius:4px"><option ${u.role === "Admin" ? "selected" : ""}>Admin</option><option ${u.role === "Editor" ? "selected" : ""}>Editor</option></select></td><td class="muted">${esc(u.last)}</td><td style="text-align:right;white-space:nowrap"><button class="btn sm" data-reset="${i}">Reset password</button> <button class="btn sm ghost danger" data-urm="${i}">Remove</button></td></tr>`).join("")}</tbody></table></div>`, "users");
  document.querySelectorAll("[data-role]").forEach((s) => s.onchange = () => { S.users[+s.dataset.role].role = s.value; toast("Role updated"); });
  document.querySelectorAll("[data-reset]").forEach((b) => b.onclick = () => toast(`Password reset link sent to ${S.users[+b.dataset.reset].email}`));
  document.querySelectorAll("[data-urm]").forEach((b) => b.onclick = () => confirmBox("Remove this user?", `${esc(S.users[+b.dataset.urm].name)} will no longer be able to log in.`, "Remove", () => { S.users.splice(+b.dataset.urm, 1); users(); }));
  $("#inv").onclick = () => { const d = $("#dlg"); d.innerHTML = `<form method="dialog" class="pad"><h2 style="font-size:20px">Add user</h2><div class="f"><label for="nu1">Full name</label><input id="nu1" type="text" required></div><div class="f"><label for="nu2">Email</label><input id="nu2" type="email" required></div><div class="f"><label for="nu3">Role</label><select id="nu3"><option>Editor</option><option>Admin</option></select></div><p class="muted" style="margin:0;font-size:14px">They'll get an email with a link to set their password.</p><div class="row" style="justify-content:flex-end"><button class="btn" value="cancel">Cancel</button><button class="btn pri" value="ok">Send invite</button></div></form>`;
    d.onclose = () => { if (d.returnValue === "ok" && $("#nu2", d).value) { S.users.push({ name: $("#nu1", d).value, email: $("#nu2", d).value, role: $("#nu3", d).value, last: "Invited" }); toast("Invite sent"); users(); } }; d.showModal(); };
}
/* ---------- login ---------- */
function login() {
  $("#app").innerHTML = `<div class="login"><div class="login-art"><span class="logo-chip"><img src="${img("acrl-logo.png")}" alt="Air and Climate Research Lab"></span><div><h1>ACRL website admin</h1><p>Manage news, events, people and pages for the Air and Climate Research Lab website.</p></div><div class="dots" aria-hidden="true"></div></div>
  <div class="login-form"><form id="lf" novalidate><h2 style="font-size:26px">Log in</h2><p class="muted" style="margin:-8px 0 4px">Use the email address your admin invited.</p>
  <div class="f"><label for="le">Email</label><input id="le" type="email" autocomplete="username" value="aq.research.group.uw.buet@gmail.com"></div>
  <div class="f"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" value="••••••••••"></div>
  <div class="row" style="justify-content:space-between"><label style="display:flex;gap:8px;align-items:center;font-size:15px"><input type="checkbox" checked> Keep me logged in</label><a href="#" id="forgot" style="font-size:15px">Forgot password?</a></div>
  <p id="lerr" class="hidden" role="alert" style="margin:0;color:#A11F2C;font-weight:600">That email or password isn't right. Try again, or reset your password.</p>
  <button class="btn pri" style="min-height:46px;justify-content:center">Log in</button>
  <p class="muted" style="font-size:13px;margin:0">After 5 wrong attempts, the account is locked for 15 minutes.</p>
  <div class="note">Prototype for testing: just click Log in. Then open <strong>Try these tasks</strong> in the menu.</div></form></div></div>`;
  $("#lf").onsubmit = (e) => { e.preventDefault(); if (!$("#le").value.includes("@")) { $("#lerr").classList.remove("hidden"); return; } location.hash = "#/tasks"; };
  $("#forgot").onclick = (e) => { e.preventDefault(); confirmBox("Reset your password", "We'll email you a link to set a new password. The link works for 1 hour.", "Send reset link", () => toast("Reset link sent")); };
}
const TASKS = [
  ["editor", "A new RA has joined. Add her with a photo and bio, and send it for approval.", "#/people/new"],
  ["editor", "Post that the lab visited a school last week, with a photo.", "#/news/new"],
  ["editor", "Announce a job opening that closes on the 30th of next month.", "#/opps/new"],
  ["admin", "Approve one of the items the editor submitted.", "#/review"],
  ["admin", "Send one item back to the editor, asking for a shorter bio or summary.", "#/review"],
  ["editor", "Find the item that was sent back, fix it and submit it again.", "#/dashboard"],
  ["admin", "Change the LinkedIn link and add a Facebook page.", "#/pages"],
  ["admin", "Find the people who asked to join the network and export them.", "#/inbox"],
  ["admin", "Move Keya to Alumni.", "#/people"],
  ["admin", "Upload a logo for the University of Dhaka.", "#/partners"]
];
function tasks() {
  page("Try these tasks", "", `<div style="max-width:860px">
  <div class="note" style="margin-bottom:18px">This is a design prototype for testing. Nothing here changes the real website. Your changes are remembered in this browser only; use <strong>Reset demo</strong> (bottom left) to start again.</div>
  <ol class="card" style="list-style:none;margin:0 0 18px;padding:6px 22px">${TASKS.map(([role, t, h], i) => `<li style="display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)">
    <input type="checkbox" data-done="${i}" ${S.tasksDone[i] ? "checked" : ""} aria-label="Mark task ${i + 1} done" style="width:20px;height:20px;flex:none">
    <span style="flex:1"><span class="chip ${role === "admin" ? "blue" : "review"}" style="margin-right:8px">As ${role === "admin" ? "Admin" : "Editor"}</span>${esc(t)}</span>
    <button class="btn sm" data-go="${i}">Start</button></li>`).join("")}</ol>
  <div class="card pad f"><label for="tn">Your notes</label><textarea id="tn" placeholder="What was confusing? What did you expect to find that wasn't there? What would you never use?" style="min-height:140px">${esc(S.testNotes)}</textarea>
  <div class="row" style="margin-top:10px"><button class="btn pri" id="saveNotes">Save notes</button><button class="btn" id="copyNotes">Copy notes</button><span class="muted" style="font-size:14px">Send your notes to the designer when you're done.</span></div></div></div>`, "tasks");
  document.querySelectorAll("[data-done]").forEach((c) => c.onchange = () => { S.tasksDone[c.dataset.done] = c.checked; persist(); });
  document.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => { const [role, , h] = TASKS[+b.dataset.go]; if (ROLE !== role) { ROLE = role; toast(`Switched to ${role === "admin" ? "Admin" : "Editor"} for this task`); } location.hash = h; if (location.hash === h) route(); });
  $("#saveNotes").onclick = () => { S.testNotes = $("#tn").value; toast("Notes saved"); };
  $("#copyNotes").onclick = async () => { S.testNotes = $("#tn").value; persist(); try { await navigator.clipboard.writeText(S.testNotes); toast("Notes copied"); } catch (e) { $("#tn").select(); toast("Select all and copy the notes"); } };
}
/* ================= ROUTER ================= */
function route() {
  const [, a = "login", b] = location.hash.split("/");
  window.scrollTo(0, 0);
  if (a === "login") return login();
  if (adminOnly(a) && ROLE !== "admin") { toast("Only admins can open that section"); location.hash = "#/dashboard"; return; }
  if (b !== undefined && SCHEMA[a]) return editor(a, b === "new" ? "new" : +b);
  ({ dashboard, research, network, partners, pages, media, review, inbox, users, tasks }[a] || (() => SCHEMA[a] ? simpleList(a) : dashboard()))();
}
housekeeping();
window.addEventListener("hashchange", () => { route(); persist(); });
route();
</script></body></html>
